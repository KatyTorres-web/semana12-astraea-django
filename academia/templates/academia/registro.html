{% extends 'academia/base.html' %}

{% block titulo %}Registro | ASTRAEA{% endblock %}

{% block contenido %}
<section class="container section">
    <div class="form-card">
        <h1>✦ Crear cuenta celestial</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {{ form.as_p }}

            <button class="btn" type="submit">
                Registrarme
            </button>
        </form>

        <p>
            ¿Ya tienes cuenta?
            <a href="{% url 'academia:login' %}">
                Iniciar sesión
            </a>
        </p>
    </div>
</section>
{% endblock %}
