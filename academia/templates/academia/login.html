{% extends 'academia/base.html' %}

{% block titulo %}Iniciar sesión | ASTRAEA{% endblock %}

{% block contenido %}
<section class="container section">
    <div class="form-card">
        <h1>☾ Iniciar sesión</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {{ form.as_p }}

            <input type="hidden"
                   name="next"
                   value="{{ next }}">

            <button class="btn" type="submit">
                Ingresar a ASTRAEA
            </button>
        </form>
    </div>
</section>
{% endblock %}
